<script type="module">
  import {
    FilesetResolver,
    ObjectDetector
  } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/vision_bundle.mjs";

  const bridge = {
    detector: null,
    ready: false,
    error: null,
    async init() {
      try {
        const vision = await FilesetResolver.forVisionTasks(
          "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/wasm"
        );

        this.detector = await ObjectDetector.createFromOptions(vision, {
          baseOptions: {
            modelAssetPath: "https://storage.googleapis.com/mediapipe-tasks/object_detector/efficientdet_lite0_uint8.tflite"
          },
          runningMode: "VIDEO",
          maxResults: 8,
          scoreThreshold: 0.4
        });

        this.ready = true;
        console.log("Object detector ready");
      } catch (error) {
        this.error = error;
        this.ready = false;
        console.error("Object detector init failed:", error);
      }
    },
    isReady() {
      return this.ready && !!this.detector;
    },
    detectForVideo(videoElement, timestampMs) {
      if (!this.isReady()) return null;
      return this.detector.detectForVideo(videoElement, timestampMs);
    }
  };

  window.objectDetectionBridge = bridge;
  bridge.init();
</script>
